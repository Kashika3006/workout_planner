{% extends "base.html" %}
{% block title %}FitPlan  - Home{% endblock %}
{% block content %}
    <h1>Personalized Workout &amp; Diet Planner</h1>
    <p>Get a plan built around your goals, activity level, and stats.</p>
    <a href="{{ url_for('onboarding') }}" class="button">Create a New Plan</a>

    <hr>

    <h2>Already have a plan?</h2>
    <div class="card">
        <form action="{{ url_for('find_dashboard') }}" method="post">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" placeholder="Enter the name you signed up with" required>
            <button type="submit">Find My Dashboard</button>
        </form>
    </div>
{% endblock %}
