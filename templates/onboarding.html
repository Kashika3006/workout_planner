{% extends "base.html" %}
{% block title %}FitPlan - New Plan{% endblock %}
{% block content %}
    <h1>Tell us about yourself</h1>

    <form action="{{ url_for('onboarding') }}" method="post">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>

        <label for="age">Age</label>
        <input type="number" id="age" name="age" min="13" max="100" required>

        <label for="gender">Gender</label>
        <select id="gender" name="gender" required>
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select>

        <label for="height_cm">Height (cm)</label>
        <input type="number" id="height_cm" name="height_cm" step="0.1" required>

        <label for="weight_kg">Weight (kg)</label>
        <input type="number" id="weight_kg" name="weight_kg" step="0.1" required>

        <label for="activity_level">Activity Level</label>
        <select id="activity_level" name="activity_level" required>
            <option value="sedentary">Sedentary (little/no exercise)</option>
            <option value="lightly_active">Lightly Active (1-3 days/week)</option>
            <option value="moderately_active" selected>Moderately Active (3-5 days/week)</option>
            <option value="very_active">Very Active (6-7 days/week)</option>
            <option value="extra_active">Extra Active (physical job + training)</option>
        </select>

        <label for="goal">Goal</label>
        <select id="goal" name="goal" required>
            <option value="muscle_gain">Muscle Gain</option>
            <option value="fat_loss">Fat Loss</option>
            <option value="maintenance">Maintenance</option>
        </select>

        <label for="experience_level">Training Experience</label>
        <select id="experience_level" name="experience_level" required>
            <option value="beginner">Beginner</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>
        </select>

        <label for="dietary_pref">Dietary Preference (optional)</label>
        <select id="dietary_pref" name="dietary_pref">
            <option value="">No preference</option>
            <option value="vegetarian">Vegetarian</option>
            <option value="vegan">Vegan</option>
            <option value="non_vegetarian">Non-Vegetarian</option>
        </select>

        <button type="submit">Generate My Plan</button>
    </form>
{% endblock %}
